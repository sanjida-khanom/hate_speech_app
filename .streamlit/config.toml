[theme]
base = "light"
primaryColor = "#1F3864"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F5F9"
textColor = "#0E1A2E"
font = "sans serif"

[server]
headless = true
maxUploadSize = 5          # MB, for batch CSV uploads
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"     # hide developer menu from visitors
